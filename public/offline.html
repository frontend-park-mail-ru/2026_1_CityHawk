<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityHawk - Офлайн</title>
    <meta name="theme-color" content="#244C87">
    <style>
      :root {
        color-scheme: light;
        --offline-bg-start: #eef4fb;
        --offline-bg-end: #dce8f6;
        --offline-surface: rgba(255, 255, 255, 0.82);
        --offline-border: rgba(36, 76, 135, 0.16);
        --offline-text: #17345b;
        --offline-muted: #55759c;
        --offline-accent: #244c87;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Manrope", Arial, sans-serif;
        color: var(--offline-text);
        background:
          radial-gradient(circle at top left, rgba(255, 255, 255, 0.75), transparent 34%),
          linear-gradient(180deg, var(--offline-bg-start), var(--offline-bg-end));
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .offline-card {
        width: min(560px, 100%);
        padding: 32px 28px;
        border-radius: 28px;
        border: 1px solid var(--offline-border);
        background: var(--offline-surface);
        backdrop-filter: blur(14px);
        box-shadow: 0 20px 60px rgba(36, 76, 135, 0.16);
      }

      .offline-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(36, 76, 135, 0.08);
        color: var(--offline-accent);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }

      h1 {
        margin: 20px 0 12px;
        font-size: clamp(30px, 5vw, 42px);
        line-height: 1.05;
      }

      p {
        margin: 0;
        color: var(--offline-muted);
        font-size: 16px;
        line-height: 1.65;
      }

      .offline-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 24px;
      }

      .offline-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 18px;
        border-radius: 14px;
        border: 1px solid transparent;
        background: var(--offline-accent);
        color: #ffffff;
        font: inherit;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
      }

      .offline-button--secondary {
        background: rgba(255, 255, 255, 0.7);
        border-color: rgba(36, 76, 135, 0.12);
        color: var(--offline-text);
      }
    </style>
  </head>
  <body>
    <main class="offline-card">
      <div class="offline-badge">Офлайн</div>
      <h1>Соединение пропало, но CityHawk рядом</h1>
      <p>Если ты уже открывал страницы раньше, часть событий и профиля продолжит работать из кэша. Когда сеть вернется, данные обновятся автоматически.</p>
      <div class="offline-actions">
        <button class="offline-button" type="button" onclick="window.location.reload()">Повторить</button>
        <a class="offline-button offline-button--secondary" href="/">На главную</a>
      </div>
    </main>
  </body>
</html>
