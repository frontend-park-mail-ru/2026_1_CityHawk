services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        NGINX_TEMPLATE: ${NGINX_TEMPLATE:-default.conf.template}
    ports:
      - "${FRONTEND_HTTP_PORT:-80}:80"
      - "${FRONTEND_HTTPS_PORT:-443}:443"
    environment:
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-host.docker.internal:8080}
      SERVER_NAME: ${SERVER_NAME:-_}
      HTTPS_REDIRECT_HOST: ${HTTPS_REDIRECT_HOST:-${SERVER_NAME:-localhost}}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-}
      YANDEX_MAPS_API_KEY: ${YANDEX_MAPS_API_KEY:-}
      SSL_CERTIFICATE: ${SSL_CERTIFICATE:-/etc/letsencrypt/live/cityhawk.example/fullchain.pem}
      SSL_CERTIFICATE_KEY: ${SSL_CERTIFICATE_KEY:-/etc/letsencrypt/live/cityhawk.example/privkey.pem}
    volumes:
      - ${SSL_CERTS_DIR:-./certbot/conf}:/etc/letsencrypt:ro
      - ${ACME_WEBROOT_DIR:-./certbot/www}:/var/www/certbot:ro
    restart: unless-stopped
